# 自动发布到 GitHub Pages：每次推送到 main 或开发分支，就把 index.html 发布成网站
# 第一次需要在仓库 Settings → Pages 里把 Source 选成「GitHub Actions」
name: Deploy to GitHub Pages
on:
  push:
    branches: [main, claude/extract-push-package-640kpg]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: |
          python3 build.py
          mkdir -p _site
          cp index.html _site/index.html
          cp -r ml _site/ml   # 抠图模型（照片识别版型用）
          touch _site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
